services:
  - type: web
    name: bitvoid-cloud-api
    runtime: docker
    rootDir: cloud-backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bitvoid-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
databases:
  - name: bitvoid-postgres
    databaseName: bitvoid
    user: bitvoid
