<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BitVoid · Account Portal</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eaf0ff;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.panel{width:min(100%,440px);background:#141d30;border:1px solid #283854;border-radius:22px;padding:28px;box-shadow:0 25px 80px #0005}.brand{font-size:13px;letter-spacing:.15em;color:#8be4cf;font-weight:800}.h{font-size:30px;font-weight:800;margin:12px 0}.sub{color:#a8b7ce;line-height:1.5}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button,.submit{border:0;border-radius:11px;padding:12px;cursor:pointer}.tabs button{background:#202c43;color:#c7d5e9;flex:1}.tabs button.active,.submit{background:#42d6b1;color:#071a18;font-weight:800}.field{display:grid;gap:7px;margin:14px 0}.field label{color:#c7d5e9;font-size:14px}.field input{width:100%;padding:13px;border:1px solid #33435e;background:#0c1424;color:white;border-radius:10px;outline:none}.submit{width:100%;margin-top:12px}.msg{min-height:24px;margin-top:12px;color:#8be4cf;font-size:14px}.hidden{display:none}.fine{font-size:12px;color:#8092ad;margin-top:18px}
</style></head><body><main class="panel"><div class="brand">BITVOID · ACCOUNT</div><div class="h">Your account, everywhere.</div><p class="sub">Create an account or sign in. Campus servers are designed to keep local data and synchronize with BitVoid Cloud when internet access is available.</p><div class="tabs"><button id="loginTab" class="active">Sign in</button><button id="registerTab">Create account</button></div><form id="form"><div id="loginField" class="field"><label>Username or email</label><input id="login" autocomplete="username"></div><div id="usernameField" class="field hidden"><label>Username (3–24 characters)</label><input id="username" autocomplete="username"></div><div id="emailField" class="field hidden"><label>Email (optional)</label><input id="email" type="email" autocomplete="email"></div><div id="displayField" class="field hidden"><label>Display name</label><input id="displayName"></div><div class="field"><label>Password (minimum 10 characters)</label><input id="password" type="password" autocomplete="current-password" minlength="10" required></div><button class="submit" id="submit" type="submit">Sign in</button></form><div class="msg" id="msg"></div><div class="fine">Prototype account portal · API endpoint: <span id="endpoint"></span></div></main><script>
const API=localStorage.getItem("bitvoid_api")||"https://YOUR-RENDER-SERVICE.onrender.com";let mode="login";const $=id=>document.getElementById(id);$("endpoint").textContent=API;function setMode(m){mode=m;$("loginTab").classList.toggle("active",m==="login");$("registerTab").classList.toggle("active",m==="register");$("loginField").classList.toggle("hidden",m!=="login");["usernameField","emailField","displayField"].forEach(id=>$(id).classList.toggle("hidden",m!=="register"));$("login").required=m==="login";$("username").required=m==="register";$("submit").textContent=m==="login"?"Sign in":"Create account";$("password").autocomplete=m==="login"?"current-password":"new-password";} $("loginTab").onclick=()=>setMode("login");$("registerTab").onclick=()=>setMode("register");$("form").onsubmit=async e=>{e.preventDefault();$("msg").textContent="Connecting…";try{const deviceKey="web-"+crypto.randomUUID();const payload=mode==="login"?{login:$("login").value,password:$("password").value,deviceKey}:{username:$("username").value,email:$("email").value||undefined,password:$("password").value,displayName:$("displayName").value||$("username").value,deviceKey};const r=await fetch(API+"/v1/auth/"+mode,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw Error(data.message||data.error||"Request failed");localStorage.setItem("bitvoid_token",data.token);localStorage.setItem("bitvoid_user",JSON.stringify(data.user));$("msg").textContent="Authenticated as "+data.user.username+"; token saved in this browser.";}catch(err){$("msg").textContent=err.message+" · API endpoint: "+API;}};setMode("login");
</script></body></html>
