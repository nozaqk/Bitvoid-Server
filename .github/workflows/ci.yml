name: CI — BitVoid Server & Native Desktop

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server-tests:
    name: Server Core (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Syntax check all JavaScript modules
        run: npm run check

      - name: Run unit, contract, integration, and security tests
        run: npm test

      - name: Validate Windows service configuration and installer script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [xml]$service = Get-Content packaging/windows/BitVoidServer.xml -Raw
          if ($service.service.id -ne "BitVoidServer") { throw "Unexpected Windows service ID." }
          if ($service.service.executable -ne "%BASE%\runtime\node.exe") { throw "Unexpected Node runtime path." }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path packaging/windows/install-service.ps1),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }

      - name: Install and exercise Windows background service
        if: runner.os == 'Windows' && matrix.node == '22'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "bitvoid-service-ci"
          $dataDir = Join-Path $env:ProgramData "BitVoidServer"
          New-Item -ItemType Directory -Force -Path "$stage\server", "$stage\runtime", "$stage\packaging\windows" | Out-Null
          Copy-Item -Recurse package.json, package-lock.json, src, bin, node_modules "$stage\server\"
          Copy-Item (Get-Command node).Source "$stage\runtime\node.exe"
          Copy-Item packaging\windows\BitVoidServer.xml "$stage\BitVoidServer.xml"
          Copy-Item packaging\windows\install-service.ps1 "$stage\packaging\windows\install-service.ps1"

          $release = Invoke-RestMethod -Headers @{ Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" } -Uri "https://api.github.com/repos/winsw/winsw/releases/tags/v.2.14.1"
          $asset = $release.assets | Where-Object { $_.name -eq "WinSW-x64.exe" } | Select-Object -First 1
          if (-not $asset) { throw "Pinned WinSW x64 release asset was not found." }
          if ($asset.digest -notmatch "^sha256:[A-Fa-f0-9]{64}$") { throw "WinSW release asset has no valid published SHA-256 digest." }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$stage\BitVoidServer.exe"
          $actual = (Get-FileHash "$stage\BitVoidServer.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $asset.digest.Substring(7).ToLowerInvariant()) { throw "WinSW SHA-256 verification failed." }

          $installScript = "$stage\packaging\windows\install-service.ps1"
          try {
            & $installScript -Action install -InstallDir $stage -DataDir $dataDir
            $healthy = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8787/api/v1/health" -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $healthy = $true; break }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $healthy) { throw "Windows service did not become healthy on port 8787." }
            $service = Get-Service -Name "BitVoidServer"
            if ($service.Status -ne "Running") { throw "Windows service is not running." }
          } finally {
            & $installScript -Action uninstall -InstallDir $stage -DataDir $dataDir
          }

          if (-not (Test-Path -LiteralPath $dataDir)) { throw "Uninstall unexpectedly removed persistent Server data." }
          Remove-Item -LiteralPath $stage -Recurse -Force


  desktop-build:
    name: Native Qt 6 Desktop App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            qt_host: linux
            qt_target: desktop
            qt_arch: linux_gcc_64
          - os: windows-2022
            qt_host: windows
            qt_target: desktop
            qt_arch: win64_msvc2022_64
          - os: macos-latest
            qt_host: mac
            qt_target: desktop
            qt_arch: clang_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux OpenGL / XKB build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: ${{ matrix.qt_host }}
          target: ${{ matrix.qt_target }}
          arch: ${{ matrix.qt_arch }}

      - name: Configure Qt 6 Desktop Application
        run: cmake -S desktop -B desktop/build -DCMAKE_BUILD_TYPE=Release

      - name: Compile Qt 6 Desktop Application
        run: cmake --build desktop/build --config Release
