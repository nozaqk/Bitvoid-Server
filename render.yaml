databases:
  - name: bitvoid-cloud-db
    plan: basic-256mb
    databaseName: bitvoid
    user: bitvoid

services:
  - type: web
    name: bitvoid-cloud-api
    runtime: node
    plan: starter
    rootDir: cloud-server
    buildCommand: npm install && npm run check
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: bitvoid-cloud-db
          property: connectionString
      - key: BITVOID_JWT_SECRET
        generateValue: true
      - key: BITVOID_SYNC_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://bitvoid-web.onrender.com

  - type: web
    name: bitvoid-web
    runtime: static
    rootDir: web-frontend
    buildCommand: ""
    staticPublishPath: .
